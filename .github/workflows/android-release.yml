name: Android Release

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Add and sync Android project
        run: |
          npm run cap:add:android || true
          npm run cap:sync

      - name: Restore Android keystore
        shell: bash
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/alphaflowx-release.jks
          cat > android/keystore.properties <<'EOF'
          storeFile=./alphaflowx-release.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK / AAB
        run: npm run android:release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: alphaflowx-android-release
          path: |
            android/app/build/outputs/**/*.apk
            android/app/build/outputs/**/*.aab
